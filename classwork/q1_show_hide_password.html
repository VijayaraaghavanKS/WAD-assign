<!DOCTYPE html>
<html>
<head>
    <title>Q1: Show/Hide Password</title>
</head>
<body>
    <input type="password" id="pass">
    <input type="checkbox" id="toggle"> Show Password
    
    <script>
        document.getElementById('toggle').onchange = function() {
            document.getElementById('pass').type = this.checked ? 'text' : 'password';
        };
    </script>
</body>
</html>
