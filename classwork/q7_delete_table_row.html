<!DOCTYPE html>
<html>
<head>
    <title>Q7: Delete Table Row</title>
</head>
<body>
    <button id="btn">Delete Last Row</button>
    <table border="1" id="tbl">
        <tr><td>Row 1</td></tr>
        <tr><td>Row 2</td></tr>
        <tr><td>Row 3</td></tr>
    </table>

    <script>
        document.getElementById('btn').onclick = function() {
            let tbl = document.getElementById('tbl');
            if (tbl.rows.length > 0) {
                tbl.deleteRow(-1);
            }
        };
    </script>
</body>
</html>
